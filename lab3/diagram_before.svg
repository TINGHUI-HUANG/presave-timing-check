<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 810" width="1000" height="810" role="img" aria-labelledby="title desc">
  <title id="title">System path before revision</title>
  <desc id="desc">The person types a request; a simulated LLM gives two or three readings; the prototype checks them against the schema, simulates them in a scenario library, asks up to three questions where the readings differ, keeps the readings that match the answers and restates the remaining rule for the person to save or edit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444c56"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #1f2328; }
      .h1 { font-size: 19px; font-weight: 700; }
      .sub { font-size: 12.5px; fill: #57606a; }
      .lane { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
      .lanetitle { font-size: 14px; font-weight: 700; fill: #57606a; }
      .t { font-size: 13px; font-weight: 700; }
      .d { font-size: 12px; }
      .s { font-size: 11px; font-style: italic; fill: #57606a; }
      .impl { fill: #e7f0ff; stroke: #2f5fb3; stroke-width: 1.6; }
      .sim { fill: #fff6e0; stroke: #b7791f; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .plan { fill: #f2f2f2; stroke: #6b7280; stroke-width: 1.6; stroke-dasharray: 2 3; }
      .arrow { stroke: #444c56; stroke-width: 1.5; fill: none; }
      .dotted { stroke-dasharray: 2 3; }
      .note { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="810" fill="#ffffff"/>
  <text class="h1" x="20" y="34">System path before revision</text>
  <text class="sub" x="20" y="56">From the typed request to a restated rule the person can save. Box style shows what is implemented, simulated or planned.</text>

  <!-- Lanes -->
  <rect class="lane" x="20" y="72" width="190" height="650" rx="8"/>
  <rect class="lane" x="225" y="72" width="440" height="650" rx="8"/>
  <rect class="lane" x="680" y="72" width="300" height="650" rx="8"/>
  <text class="lanetitle" x="115" y="96" text-anchor="middle">Person</text>
  <text class="lanetitle" x="445" y="96" text-anchor="middle">System (prototype/sim.py)</text>
  <text class="lanetitle" x="830" y="96" text-anchor="middle">Data, fallbacks and platform</text>

  <!-- Person lane -->
  <rect class="sim" x="35" y="112" width="160" height="58" rx="6"/>
  <text class="t" x="45" y="133">Types a request</text>
  <text class="d" x="45" y="150">"...home after dark"</text>
  <text class="s" x="45" y="164">Simulated in tests</text>

  <rect class="sim" x="35" y="424" width="160" height="58" rx="6"/>
  <text class="t" x="45" y="445">Answers</text>
  <text class="d" x="45" y="462">Yes / No / Not sure</text>
  <text class="s" x="45" y="476">Simulated in tests</text>

  <rect class="sim" x="35" y="580" width="160" height="58" rx="6"/>
  <text class="t" x="45" y="601">Reads the rule</text>
  <text class="d" x="45" y="618">chooses Save or Edit</text>
  <text class="s" x="45" y="632">Simulated in tests</text>

  <text class="note" x="35" y="672">With --interactive a real</text>
  <text class="note" x="35" y="687">person types the answers</text>
  <text class="note" x="35" y="702">instead.</text>

  <!-- System lane -->
  <rect class="sim" x="245" y="112" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="133">1  Translate the request into 2–3 readings</text>
  <text class="d" x="257" y="150">LLM → trigger–condition–action rules (JSON)</text>
  <text class="s" x="257" y="164">Simulated: readings fixed in tests.json</text>

  <rect class="impl" x="245" y="190" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="211">2  Check the readings against the schema</text>
  <text class="d" x="257" y="228">hallway light; arrive, leave, sunset; home, dark</text>
  <text class="s" x="257" y="242">Implemented</text>

  <rect class="impl" x="245" y="268" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="289">3  Simulate every reading in every scenario</text>
  <text class="d" x="257" y="306">deterministic Python simulator</text>
  <text class="s" x="257" y="320">Implemented</text>

  <rect class="impl" x="245" y="346" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="367">4  Pick the next scenario to ask about</text>
  <text class="d" x="257" y="384">one where the remaining readings differ</text>
  <text class="s" x="257" y="398">Implemented</text>

  <rect class="impl" x="245" y="424" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="445">5  Ask a yes/no question about it</text>
  <text class="d" x="257" y="462">"Home since 17:00, dark at 18:00: light on?"</text>
  <text class="s" x="257" y="476">Implemented (terminal text)</text>

  <rect class="impl" x="245" y="502" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="523">6  Keep the readings that match the answer</text>
  <text class="d" x="257" y="540">back to 4 until none is left to ask or 3 are asked</text>
  <text class="s" x="257" y="554">Implemented</text>

  <rect class="impl" x="245" y="580" width="400" height="58" rx="6"/>
  <text class="t" x="257" y="601">7  Restate the remaining rule in plain words</text>
  <text class="d" x="257" y="618">offers Save or Edit; nothing is saved without Save</text>
  <text class="s" x="257" y="632">Implemented</text>

  <!-- Right lane -->
  <rect class="plan" x="695" y="112" width="270" height="58" rx="6"/>
  <text class="t" x="705" y="133">Fallback: LLM unavailable</text>
  <text class="d" x="705" y="150">say so; offer manual editing</text>
  <text class="s" x="705" y="164">Planned</text>

  <rect class="impl" x="695" y="190" width="270" height="58" rx="6"/>
  <text class="t" x="705" y="211">Fallback: out of scope</text>
  <text class="d" x="705" y="228">say what is supported; create nothing</text>
  <text class="s" x="705" y="242">Implemented</text>

  <rect class="impl" x="695" y="268" width="270" height="58" rx="6"/>
  <text class="t" x="705" y="289">Scenario library S1–S4</text>
  <text class="d" x="705" y="306">hand-built JSON; sunset fixed at 18:00</text>
  <text class="s" x="705" y="320">Implemented</text>

  <rect class="impl" x="695" y="502" width="270" height="58" rx="6"/>
  <text class="t" x="705" y="523">Fallback: 0 or 2+ readings left</text>
  <text class="d" x="705" y="540">show them; the person picks or edits</text>
  <text class="s" x="705" y="554">Implemented</text>

  <rect class="plan" x="695" y="580" width="270" height="58" rx="6"/>
  <text class="t" x="705" y="601">Save to the home platform</text>
  <text class="d" x="705" y="618">Google Home or Home Assistant</text>
  <text class="s" x="705" y="632">Planned (prototype prints "saved")</text>

  <!-- Arrows -->
  <path class="arrow" marker-end="url(#arrow)" d="M195,141 H245"/>
  <path class="arrow" marker-end="url(#arrow)" d="M445,170 V190"/>
  <path class="arrow" marker-end="url(#arrow)" d="M445,248 V268"/>
  <path class="arrow" marker-end="url(#arrow)" d="M445,326 V346"/>
  <path class="arrow" marker-end="url(#arrow)" d="M445,404 V424"/>
  <path class="arrow" marker-end="url(#arrow)" d="M445,482 V502"/>
  <path class="arrow" marker-end="url(#arrow)" d="M445,560 V580"/>
  <path class="arrow" marker-end="url(#arrow)" d="M245,444 H195"/>
  <path class="arrow" marker-end="url(#arrow)" d="M195,464 H245"/>
  <path class="arrow" marker-end="url(#arrow)" d="M245,600 H195"/>
  <path class="arrow" marker-end="url(#arrow)" d="M195,620 H245"/>
  <path class="arrow" marker-end="url(#arrow)" d="M645,515 H658 V392 H645"/>
  <path class="arrow dotted" marker-end="url(#arrow)" d="M645,141 H695"/>
  <path class="arrow" marker-end="url(#arrow)" d="M645,219 H695"/>
  <path class="arrow" marker-end="url(#arrow)" d="M695,297 H645"/>
  <path class="arrow" marker-end="url(#arrow)" d="M645,545 H695"/>
  <path class="arrow dotted" marker-end="url(#arrow)" d="M645,609 H695"/>

  <!-- Legend -->
  <rect class="impl" x="20" y="742" width="30" height="18" rx="3"/>
  <text class="d" x="58" y="756">Implemented in prototype/sim.py</text>
  <rect class="sim" x="290" y="742" width="30" height="18" rx="3"/>
  <text class="d" x="328" y="756">Simulated (fixed readings, scripted person)</text>
  <rect class="plan" x="640" y="742" width="30" height="18" rx="3"/>
  <text class="d" x="678" y="756">Planned</text>
  <text class="note" x="20" y="790">Scenarios: S1 home since 17:00, dark at 18:00 · S2 arrive at 19:00 after dark · S3 arrive at 15:00 in daylight · S4 light on, leave at 23:30.</text>
</svg>
