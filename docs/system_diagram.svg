<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1030" width="940" height="1030" role="img"
  aria-label="System diagram of the pre-save timing check">
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#444c56"/></marker>
  <style>
    text { font-family: "Segoe UI", Arial, Helvetica, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 700; fill: #3d444d; }
    .t { font-size: 15px; font-weight: 700; }
    .d { font-size: 13px; }
    .s { font-size: 11.5px; font-style: italic; fill: #57606a; }
    .lab { font-size: 12px; fill: #3d444d; }
    .badge { font-size: 11px; font-weight: 700; fill: #ffffff; }
    .arrow { stroke: #444c56; stroke-width: 1.5; fill: none; }
  </style>
</defs>
<rect width="940" height="1030" fill="#ffffff"/>
<rect x="20" y="12" width="220" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="130.0" y="32" text-anchor="middle">Person · web page</text>
<rect x="320" y="12" width="320" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="480.0" y="32" text-anchor="middle">Checker · Python (app.py, checker/)</text>
<rect x="700" y="12" width="220" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text class="h" x="810.0" y="32" text-anchor="middle">Model and data</text>
<rect x="20" y="60" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="30" y="81" text-anchor="start">Types one sentence</text>
<text class="d" x="30" y="99" text-anchor="start">or picks an example chip</text>
<text class="s" x="30" y="119" text-anchor="start">Implemented</text>
<rect x="20" y="150" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="30" y="171" text-anchor="start">Decline or error card</text>
<text class="d" x="30" y="189" text-anchor="start">no rule is created</text>
<text class="s" x="30" y="209" text-anchor="start">Implemented</text>
<rect x="20" y="420" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="30" y="441" text-anchor="start">Question card</text>
<text class="d" x="30" y="459" text-anchor="start">situation · why · Yes/No/Not sure</text>
<text class="s" x="30" y="479" text-anchor="start">Implemented</text>
<rect x="20" y="510" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="30" y="531" text-anchor="start">Repair card</text>
<text class="d" x="30" y="549" text-anchor="start">Add / Don't add / Edit</text>
<text class="s" x="30" y="569" text-anchor="start">Implemented</text>
<rect x="20" y="600" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="30" y="621" text-anchor="start">Confirm or choose card</text>
<text class="d" x="30" y="639" text-anchor="start">rule · what it never does</text>
<text class="s" x="30" y="659" text-anchor="start">Implemented</text>
<rect x="20" y="690" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="30" y="711" text-anchor="start">Saved card</text>
<text class="d" x="30" y="729" text-anchor="start">saved in the prototype only</text>
<text class="s" x="30" y="749" text-anchor="start">Implemented</text>
<rect x="320" y="60" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="81" text-anchor="start">1  Assemble the context</text>
<text class="d" x="330" y="99" text-anchor="start">instruction v1 + the request, nothing else</text>
<text class="s" x="330" y="119" text-anchor="start">Implemented</text>
<rect x="320" y="150" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="171" text-anchor="start">2  Check the reply</text>
<text class="d" x="330" y="189" text-anchor="start">shape · vocabulary · ≤3 readings · merge twins</text>
<text class="s" x="330" y="209" text-anchor="start">Implemented</text>
<rect x="320" y="240" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="261" text-anchor="start">3  Simulate</text>
<text class="d" x="330" y="279" text-anchor="start">every reading in every scenario</text>
<text class="s" x="330" y="299" text-anchor="start">Implemented</text>
<rect x="320" y="330" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="351" text-anchor="start">4  Choose the next question</text>
<text class="d" x="330" y="369" text-anchor="start">differ → ask; last kept for a bug-class probe; ≤3</text>
<text class="s" x="330" y="389" text-anchor="start">Implemented</text>
<rect x="492" y="372" width="142" height="18" rx="9" fill="#6f42c1"/>
<text class="badge" x="563.0" y="385" text-anchor="middle">decides when to ask</text>
<rect x="320" y="420" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="441" text-anchor="start">5  Apply the answer</text>
<text class="d" x="330" y="459" text-anchor="start">keep matching readings; Not sure keeps all</text>
<text class="s" x="330" y="479" text-anchor="start">Implemented</text>
<rect x="320" y="510" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="531" text-anchor="start">6  Propose a missing rule</text>
<text class="d" x="330" y="549" text-anchor="start">repair template of the probe scenario</text>
<text class="s" x="330" y="569" text-anchor="start">Implemented</text>
<rect x="320" y="600" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="621" text-anchor="start">7  Restate and wait</text>
<text class="d" x="330" y="639" text-anchor="start">from the rule itself; never saves on its own</text>
<text class="s" x="330" y="659" text-anchor="start">Implemented</text>
<rect x="320" y="690" width="320" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="330" y="711" text-anchor="start">8  Save once</text>
<text class="d" x="330" y="729" text-anchor="start">a second click cannot save twice</text>
<text class="s" x="330" y="749" text-anchor="start">Implemented</text>
<rect x="700" y="60" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="710" y="81" text-anchor="start">Gemini (LLM)</text>
<text class="d" x="710" y="99" text-anchor="start">1–3 readings as JSON</text>
<text class="s" x="710" y="119" text-anchor="start">Implemented · live, needs a key</text>
<rect x="891" y="67" width="23" height="18" rx="9" fill="#6f42c1"/>
<text class="badge" x="902.5" y="80" text-anchor="middle">AI</text>
<rect x="700" y="136" width="220" height="48" rx="7" fill="#fff6e0" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="7 4"/>
<text class="t" x="710" y="157" text-anchor="start">Recorded replies</text>
<text class="s" x="710" y="177" text-anchor="start">Recorded · replayed, no key</text>
<rect x="700" y="192" width="220" height="48" rx="7" fill="#fff6e0" stroke="#b7791f" stroke-width="1.6" stroke-dasharray="7 4"/>
<text class="t" x="710" y="213" text-anchor="start">Lab 3 hand-written</text>
<text class="s" x="710" y="233" text-anchor="start">Simulated · requests A and B</text>
<rect x="700" y="252" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="710" y="273" text-anchor="start">Scenario library S1–S5</text>
<text class="d" x="710" y="291" text-anchor="start">one moment each; sunset 18:00</text>
<text class="s" x="710" y="311" text-anchor="start">Implemented</text>
<rect x="700" y="420" width="220" height="66" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="710" y="441" text-anchor="start">Session log (JSONL)</text>
<text class="d" x="710" y="459" text-anchor="start">every step; who clicked</text>
<text class="s" x="710" y="479" text-anchor="start">Implemented</text>
<rect x="700" y="690" width="220" height="50" rx="7" fill="#e7f0ff" stroke="#2f5fb3" stroke-width="1.6"/>
<text class="t" x="710" y="711" text-anchor="start">Saved rules (local JSON)</text>
<text class="s" x="710" y="733" text-anchor="start">Implemented</text>
<rect x="700" y="770" width="220" height="50" rx="7" fill="#f3f3f3" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="2 3"/>
